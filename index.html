<style>
/* Layout: sticky top bar, category rail on the left, scrolling shelves of game tiles; game page = player + side column */
:root{
  --bg:#111814; --panel:#18221d; --panel-2:#223029; --line:#2d3d35;
  --fg:#eef3ea; --muted:#9db0a4; --accent:#ffb22e; --accent-ink:#2b1a00; --leaf:#62d68f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,"Segoe UI",sans-serif;
  --r:12px; --rail:220px; --bar:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:var(--bar);display:flex;align-items:center;gap:16px;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-size:28px;letter-spacing:.5px;color:var(--accent);white-space:nowrap}
.logo small{font-family:var(--body);font-weight:800;font-size:13px;color:var(--fg);letter-spacing:2px;text-transform:uppercase}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--leaf);margin-right:2px;box-shadow:9px -7px 0 -3px var(--leaf),-9px -7px 0 -3px var(--leaf)}
.search{flex:1;max-width:460px;margin-left:auto;margin-right:auto;position:relative}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  font:inherit;padding:0 16px 0 40px}
.search svg{position:absolute;left:14px;top:12px;width:16px;height:16px;stroke:var(--muted)}
.wrap{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100% - var(--bar))}
.rail{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--bar));overflow:auto;
  padding:12px 10px 24px max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--panel)}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:700;color:var(--muted)}
.rail a:hover{background:var(--panel-2);color:var(--fg)}
.rail a.on{background:var(--panel-2);color:var(--accent)}
.rail .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.rail hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
main{min-width:0;padding-block:20px 40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.3px;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px}
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.shelf-head a{color:var(--accent);font-weight:800;font-size:13px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,210px);gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px}
.art{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:var(--r);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.25),transparent 45%),linear-gradient(135deg,var(--c1),var(--c2));
  transition:transform .15s ease,box-shadow .15s ease}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 22px)}
.tile:hover .art{transform:translateY(-3px);box-shadow:0 0 0 3px var(--accent)}
.tname{position:relative;z-index:1;font-family:var(--display);font-size:22px;line-height:1.05;text-align:center;padding:0 10px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.badge{position:absolute;z-index:1;left:8px;top:8px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.badge.play{background:var(--accent);color:var(--accent-ink)}
.badge.soon{background:rgba(0,0,0,.55);color:#fff}
.meta{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ad{border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;min-height:var(--h,90px);
  color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(255,255,255,.02) 12px 24px)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.player{position:relative;aspect-ratio:16/10;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden}
.player canvas{width:100%;height:100%;display:block;touch-action:none}
.cover{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:16px;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,var(--c1),var(--c2))}
.cover h1{font-size:clamp(28px,5vw,48px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:var(--panel-2);color:var(--fg);padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.under{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.under h1{font-size:24px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;margin-top:16px;max-width:75ch}
.info p{margin:0;line-height:1.55;color:var(--muted)}
.info b{color:var(--fg)}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.side{display:flex;flex-direction:column;gap:16px}
.side .grid{grid-template-columns:1fr 1fr;gap:10px}
.side .tname{font-size:16px}
.side .meta{font-size:12px}
.empty{color:var(--muted)}
.page{max-width:70ch;display:flex;flex-direction:column;gap:12px;line-height:1.6}
.page p{margin:0;color:var(--muted)}
.note{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
footer{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
footer a:hover{color:var(--fg)}
/* Banana Rush (clicker) */
.clicker{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;color:#2b1a00;
  background:linear-gradient(160deg,#fff3c4,#ffd76a)}
.clicker .left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.clicker .count{font-family:var(--display);font-size:clamp(22px,4vw,38px)}
.clicker .rate{font-weight:800;font-size:13px;opacity:.75}
.banana{width:min(70%,190px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 40% 35%,#fff9d6,#ffd23f 60%,#e8a400);
  box-shadow:0 6px 0 #b77f00;display:grid;place-items:center;transition:transform .05s}
.banana:active{transform:scale(.95) translateY(3px);box-shadow:0 3px 0 #b77f00}
.banana svg{width:70%;height:70%}
.shop{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.shop button{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;border:0;border-radius:10px;padding:8px 10px;
  background:rgba(255,255,255,.7);color:#2b1a00;cursor:pointer}
.shop button:disabled{opacity:.5;cursor:not-allowed}
.shop b{font-size:14px} .shop small{grid-column:1;font-size:11px;opacity:.75} .shop em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:800;font-size:13px}
body{background:radial-gradient(1100px 520px at 85% -10%,rgba(98,214,143,.13),transparent 70%),radial-gradient(900px 520px at -10% 20%,rgba(255,178,46,.09),transparent 70%),var(--bg);background-attachment:fixed}
.art.shot{background-size:cover;background-position:center}
.art.shot::after{background:linear-gradient(transparent 55%,rgba(0,0,0,.35))}
.art::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease}
.tile:hover .art::before{transform:translateX(120%)}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;min-height:300px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:28px;padding:32px 32px 48px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 24px 60px rgba(0,0,0,.35)}
.hero::before{content:"";position:absolute;inset:-60px;z-index:-1;background:var(--img,none) center/cover;filter:blur(34px) saturate(1.4);opacity:.6}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,15,12,.88) 10%,rgba(9,15,12,.25))}
.hero-copy{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.hero-copy.anim{animation:rise .5s ease}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(36px,5.2vw,64px);line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.hero p{margin:0;color:#dfe9e2;max-width:40ch;line-height:1.5;font-size:16px}
.hero .btn{font-size:18px;padding:14px 34px;box-shadow:0 6px 0 #b9790f}
.hero .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b9790f}
.hero-shot{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.18);
  transform:rotate(1.5deg);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-.5deg) translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dots{position:absolute;bottom:18px;left:32px;display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:999px;border:0;padding:0;cursor:pointer;background:rgba(255,255,255,.45);transition:width .3s}
.dots button.on{width:30px;background:var(--accent)}
.player canvas{object-fit:contain}
.player:fullscreen{aspect-ratio:auto;width:100%;height:100%;border-radius:0}
.tip{display:none;margin:8px 0 0;color:var(--muted);font-size:13px}
@media (max-width:700px) and (orientation:portrait){.tip{display:block}}
@media (max-width:1100px){.game{grid-template-columns:minmax(0,1fr)}.side .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.side .ad{max-width:728px;--h:90px!important}}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:16px 16px 44px;gap:14px}.hero>a{order:-1}.hero-shot{transform:none;animation:none}.hero h1{font-size:40px}.hero p{font-size:14px}.dots{left:16px}}
@media (max-width:520px){.player.dom{aspect-ratio:auto;height:460px}}
@media (hover:none){.tile:hover .art{transform:none;box-shadow:none}}

.hud div{background:rgba(24,14,4,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;gap:2px;line-height:1;min-width:64px}
.hud b{font-family:var(--display);font-weight:400;font-size:clamp(16px,2.6vw,24px);font-variant-numeric:tabular-nums}

.hbtns{position:absolute;top:calc(100% + 6px);right:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}.hbtns .mute{margin-left:0;padding:6px 10px;font-size:11px}

/* ===== GameZone-style redesign (2026-11-01, user approved design-mockup/index.html) ===== */
:root{--bg:#0a0e1f;--panel:#0d1226;--panel-2:#1a2142;--line:#222a4d;--fg:#eef1ff;--muted:#8a93b8;--accent:#7c3aed;--accent2:#5b5cf6;--accent-ink:#fff;--cyan:#38d6ff;--gold:#ffc83d;--card:#141a33;
  --display:"Poppins",system-ui,sans-serif;--body:"Poppins",system-ui,sans-serif}
body{background:var(--bg);font-size:14px}
.bar{background:rgba(10,14,31,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:22px}
.logo{align-items:center;gap:10px;color:var(--fg);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.5px;width:196px}
.logo .lic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--accent2));display:grid;place-items:center;font-size:17px;color:#fff}
.logo b{color:var(--cyan)}
.search{margin-left:0;margin-right:0;max-width:440px}
.search input{border-radius:12px;background:var(--card);border-color:var(--line)}
.tnav{display:flex;gap:6px;margin-left:auto}
.tnav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;font-size:14px;font-weight:600;color:#cfd4ee;white-space:nowrap}
.tnav a.on,.tnav a:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.tnav .fa-fire{color:#ff6a3d}.tnav .fa-star,.tnav .fa-trophy{color:var(--gold)}.tnav a.on i,.tnav a:hover i{color:#fff}
.rail{background:var(--panel);padding:14px 10px}
.rail a{gap:14px;padding:11px 14px;border-radius:12px;font-weight:500;font-size:14px;color:#c4cae6;margin-bottom:2px}
.rail a i{width:20px;text-align:center;color:#aeb6dc}
.rail a:hover{background:var(--card);color:#fff}
.rail a.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
.rail a.on i{color:#fff}
main{gap:22px;padding-top:18px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:0}
h2{font-size:22px}
.shelf-head a{color:var(--cyan);font-weight:600}
.row{grid-auto-columns:minmax(170px,200px)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;gap:0;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-4px);border-color:var(--accent)}
.tile .art{border-radius:0;aspect-ratio:4/3}
.tile:hover .art{transform:none;box-shadow:none}
.tname{font-family:var(--display);font-weight:800;font-size:18px}
.meta{padding:9px 11px 11px;font-weight:600;font-size:14px}
.meta span{color:var(--muted);font-size:12px;margin-top:2px}
.meta span i{margin-right:5px;color:var(--cyan)}
.badge{font-size:10px;font-weight:700;letter-spacing:.4px}
.badge.play{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.badge.new{background:linear-gradient(135deg,#ff3d8b,#ff7a1a);color:#fff}
.badge.d3{background:rgba(10,14,31,.75);color:#fff}
.ad{display:none}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.btn.ghost{background:var(--card);box-shadow:none;border:1px solid var(--line)}
.hero{display:flex;align-items:center;min-height:300px;padding:0 38px;border-radius:20px;background:#000;box-shadow:none;gap:0}
.hero::before{inset:0;filter:saturate(1.25) contrast(1.05);opacity:1}
.hero::after{background:linear-gradient(90deg,rgba(10,14,31,.95) 0%,rgba(10,14,31,.6) 42%,rgba(124,58,237,.12) 70%,transparent),linear-gradient(0deg,rgba(10,14,31,.55),transparent 40%)}
.hero>a{display:none}
.hero-copy{max-width:520px;gap:10px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.8px;color:#fff;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hero h1{font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-1px;font-size:clamp(40px,5vw,62px);line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hero h1 em{color:var(--cyan);font-style:italic}
.hero p{font-size:14px;color:#d6dbf3}
.hero .btn{font-size:15px;padding:13px 28px;box-shadow:0 8px 24px rgba(124,58,237,.45);border-radius:999px}
.hero .btn:active{transform:translateY(2px);box-shadow:0 4px 12px rgba(124,58,237,.45)}
.dots{left:50%;transform:translateX(-50%);bottom:14px}
.dots button{width:8px;height:8px;background:rgba(255,255,255,.4)}
.dots button.on{width:8px;background:#fff}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cat{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;border:1px solid var(--line);transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,14,31,.9),transparent 55%)}
.cat span{position:absolute;left:10px;bottom:8px;z-index:1;font-weight:700;font-size:14px}
.cat.ph{display:grid;place-items:center;font-size:30px;color:#fff}
.cover h1{font-style:italic;font-weight:900;text-transform:uppercase}
.info{background:var(--card)}
.chip{background:var(--panel-2)}
@media (max-width:1100px){.tnav a span{display:none}}
@media (max-width:860px){.tnav{display:none}.logo{width:auto;font-size:18px}.logo .lic{width:32px;height:32px}.rail a i{display:none}.hero{padding:0 20px;min-height:260px}.hero h1{font-size:40px}.cats{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cat span{font-size:11px;left:6px}}
@media (max-width:520px){.row{grid-auto-columns:150px}}
@media (max-width:860px){.hero{align-items:flex-end;padding:0 18px 40px}.hero p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dots{left:auto;right:16px;transform:none;bottom:16px}
  .cats{display:flex;overflow-x:auto;scrollbar-width:none;gap:8px}.cat{flex:0 0 86px}.cat.ph{font-size:22px;padding-bottom:18px}.cat span{white-space:nowrap}}
</style>

const SHOW=['zoo-kart'];
const ALL_GAMES=GAMES.slice();GAMES.splice(0,GAMES.length,...ALL_GAMES.filter(g=>SHOW.includes(g.id)));
const byId=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem('tz-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('tz-'+k,JSON.stringify(v))}catch(e){}};

const THUMBS={};
function tile(g){const t=THUMBS[g.id];
  return `<a class="tile" href="#g-${g.id}"><span class="art${t?' shot':''}" style="--c1:${g.c1};--c2:${g.c2}${t?`;background-image:url(${t})`:''}">
    <span class="badge ${g.isNew?'new':g.play?'play':'soon'}">${g.isNew?'NEW':g.play?'Play now':'Coming soon'}</span>${g.d3?'<span class="badge d3">3D</span>':''}
    ${t?'':`<span class="tname">${esc(g.name)}</span>`}</span>
    <span class="meta">${esc(g.name)}<span><i class="fa-solid ${CICON[g.cat]||'fa-gamepad'}"></i>${CAT[g.cat]}</span></span></a>`;
}
const shelf=(title,list,link)=>list.length?`<section class="shelf"><div class="shelf-head"><h2>${title}</h2>${link?`<a href="${link}">View all</a>`:''}</div>
  <div class="row">${list.map(tile).join('')}</div></section>`:'';
const ad=(w,h)=>`<div class="ad" style="--h:${Math.min(h,250)}px" aria-label="Advertisement space">Ad space · ${w} × ${h}</div>`;
const footer=`<footer><span>© ${new Date().getFullYear()} TopZoo Games</span><a href="#about">About</a><a href="#privacy">Privacy policy</a><a href="#terms">Terms</a><a href="#developers">Submit a game</a></footer>`;
const sorted=()=>[...GAMES].sort((a,b)=>(b.play?1:0)-(a.play?1:0));

function rail(active){
  const link=(h,t,ic)=>`<a href="#${h}" class="${active===h?'on':''}"><i class="fa-solid ${ic}"></i>${t}</a>`;
  document.getElementById('rail').innerHTML=link('home','Home','fa-house')+link('originals','All Games','fa-gamepad')+link('popular','Popular','fa-fire')+link('new','New games','fa-star')+'<hr>'+
    CATS.filter(([k])=>GAMES.some(g=>g.cat===k&&g.play)).map(([k,t])=>link('c-'+k,t,CICON[k]||'fa-gamepad')).join('')+'<hr>'+(GAMES.some(g=>!g.play)?link('coming','Coming soon','fa-hourglass-half'):'')+link('about','About','fa-circle-info');
  document.querySelectorAll('#tnav a').forEach(a=>a.classList.toggle('on',a.dataset.h===active));
}

let stopGame=null;
function render(){
  clearInterval(heroTimer);
  if(stopGame){stopGame();stopGame=null}
  const h=(location.hash||'#home').slice(1);
  const v=document.getElementById('view');
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q){
    rail('');
    const hits=GAMES.filter(g=>g.name.toLowerCase().includes(q)||CAT[g.cat].toLowerCase().includes(q));
    v.innerHTML=`<h1>Results for “${esc(q)}”</h1>${hits.length?`<div class="grid">${hits.map(tile).join('')}</div>`:'<p class="empty">No games match that search. Try an animal name or a category such as “puzzle”.</p>'}${footer}`;
    return;
  }
  rail(h.startsWith('g-')?'':h);
  if(h.startsWith('g-')&&byId[h.slice(2)]) return gamePage(byId[h.slice(2)],v);
  if(h.startsWith('c-')&&CAT[h.slice(2)]){
    const k=h.slice(2),list=GAMES.filter(g=>g.cat===k);
    v.innerHTML=`<h1>${CAT[k]} games</h1>${ad(728,90)}<div class="grid">${list.map(tile).join('')}</div>${footer}`;return;
  }
  if(h==='originals'){v.innerHTML=`<h1>TopZoo Originals</h1><p class="empty">Games made by TopZoo, playable right now.</p><div class="grid">${GAMES.filter(g=>g.play).map(tile).join('')}</div>${footer}`;return}
  if(h==='new'){v.innerHTML=`<h1>New games</h1><div class="grid">${[...GAMES.filter(g=>g.play&&g.isNew),...GAMES.filter(g=>g.play&&!g.isNew)].map(tile).join('')}</div>${footer}`;return}
  if(h==='popular'){v.innerHTML=`<h1>Popular games</h1><div class="grid">${GAMES.filter(g=>g.play).map(tile).join('')}</div>${footer}`;return}
  if(h==='coming'){v.innerHTML=`<h1>Coming soon</h1><p class="empty">Games we are building next. Follow TopZoo on Facebook to hear first.</p><div class="grid">${GAMES.filter(g=>!g.play).map(tile).join('')}</div>${footer}`;return}
  if(PAGES[h]){v.innerHTML=`<div class="page">${PAGES[h]}</div>${footer}`;return}
  const playable=GAMES.filter(g=>g.play),catKeys=CATS.map(c=>c[0]).filter(k=>playable.some(g=>g.cat===k));
  const catTiles=catKeys.map(k=>{const g=playable.find(x=>x.cat===k),t=THUMBS[g.id];return `<a class="cat${t?'':' ph'}" href="#c-${k}" style="${t?`background-image:url(${t})`:`background:linear-gradient(135deg,${g.c1},${g.c2})`}">${t?'':`<i class="fa-solid ${CICON[k]}"></i>`}<span>${CAT[k]}</span></a>`}).join('')+
    `<a class="cat ph" href="#new" style="background:linear-gradient(135deg,#2b1a5c,#123a5c)"><i class="fa-solid fa-star"></i><span>New</span></a>`+(GAMES.some(g=>!g.play)?`<a class="cat ph" href="#coming" style="background:linear-gradient(135deg,#1d4a2f,#2b1a5c)"><i class="fa-solid fa-paw"></i><span>Coming soon</span></a>`:'');
  v.innerHTML='<section class="hero" id="hero" aria-label="Featured game"></section><section class="cats">'+catTiles+'</section>'+shelf('Popular Games',playable,'#popular')+shelf('New Games',playable.filter(g=>g.isNew),'#new')+
    catKeys.map(k=>shelf(CAT[k]+' games',playable.filter(g=>g.cat===k),'#c-'+k)).join('')+shelf('Coming soon',GAMES.filter(g=>!g.play),'#coming')+footer;
  paintHero();restartHero();window.scrollTo(0,0);
}

/* featured banner on the home page */
let heroTimer=null,heroI=0;
function paintHero(anim){const el=document.getElementById('hero');if(!el)return;
  const list=GAMES.filter(g=>g.play),i=heroI%list.length,g=list[i],t=THUMBS[g.id];
  el.style.cssText=`--c1:${g.c1};--c2:${g.c2};${t?`--img:url(${t})`:''}`;
  const nw=esc(g.name).split(' '),ttl=nw.length>1?nw.slice(0,-1).join(' ')+' <em>'+nw[nw.length-1]+'</em>':nw[0];
  el.innerHTML=`<div class="hero-copy${anim?' anim':''}"><span class="eyebrow">Featured game · ${CAT[g.cat]}</span><h1>${ttl}</h1><p>${esc(g.about)}</p><a class="btn" href="#g-${g.id}"><i class="fa-solid fa-play"></i> Play Now</a></div>
    ${t?`<a href="#g-${g.id}" tabindex="-1"><img class="hero-shot" src="${t}" alt="${esc(g.name)} gameplay"></a>`:'<div></div>'}
    <div class="dots">${list.map((x,k)=>`<button aria-label="Show ${esc(x.name)}" class="${k===i?'on':''}" data-i="${k}"></button>`).join('')}</div>`;
  el.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{heroI=+b.dataset.i;paintHero(true);restartHero()})}
function restartHero(){clearInterval(heroTimer);heroTimer=setInterval(()=>{heroI++;paintHero(true)},5500)}

/* real game screenshots for tiles, drawn from each game's own code */
function bananaThumb(){const c=document.createElement('canvas');c.width=800;c.height=500;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,800,500);g.addColorStop(0,'#fff3c4');g.addColorStop(1,'#ffc23a');x.fillStyle=g;x.fillRect(0,0,800,500);
  x.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){x.beginPath();x.arc((i*137)%800,(i*91)%500,18+(i%4)*8,0,7);x.fill()}
  const r=x.createRadialGradient(270,230,20,300,260,170);r.addColorStop(0,'#fff9d6');r.addColorStop(.6,'#ffd23f');r.addColorStop(1,'#e8a400');
  x.fillStyle='#b77f00';x.beginPath();x.arc(300,272,165,0,7);x.fill();x.fillStyle=r;x.beginPath();x.arc(300,260,165,0,7);x.fill();
  x.save();x.translate(300,260);x.rotate(-.3);x.fillStyle='#fff36b';x.strokeStyle='#8a5a00';x.lineWidth=8;x.beginPath();
  x.moveTo(-95,-60);x.bezierCurveTo(-80,60,40,110,110,60);x.bezierCurveTo(90,110,-10,120,-60,80);x.bezierCurveTo(-110,40,-115,-20,-95,-60);x.fill();x.stroke();x.restore();
  x.fillStyle='#2b1a00';x.font='54px "Lilita One",sans-serif';x.textAlign='left';x.fillText('12,480',500,190);
  x.font='800 24px Nunito,sans-serif';x.fillText('bananas',502,226);
  [['Monkey ×24',290],['Banana tree ×9',350],['Plantation ×3',410]].forEach(([t,y])=>{x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.roundRect(500,y-30,250,46,10);x.fill();x.fillStyle='#2b1a00';x.font='800 20px Nunito,sans-serif';x.fillText(t,516,y)});
  return c.toDataURL('image/jpeg',.82)}
function makeThumbs(){window.__thumb=true;
  for(const g of GAMES){if(g.id==='cheetah-drift'){THUMBS[g.id]=DRIFT_THUMB;continue}if(g.id==='zoo-blocks-3d'){THUMBS[g.id]=ZOO_THUMB;continue}if(g.id==='zoo-kart'){if(window.KART_THUMB)THUMBS[g.id]=window.KART_THUMB;continue}if(g.id==='monkey-swing'){if(window.MONKEY_THUMB)THUMBS[g.id]=window.MONKEY_THUMB;continue}if(!g.play)continue;try{
    if(g.id==='banana-rush'){THUMBS[g.id]=bananaThumb();continue}
    if(g.d3){const T3=g.id==='cheetah-chase'?CHEETAH_THUMB:RHINO_THUMB;if(T3)THUMBS[g.id]=T3;continue}
    const d=document.createElement('div');GAMEFN[g.id](d);THUMBS[g.id]=d.querySelector('canvas').toDataURL('image/jpeg',.82)}catch(e){}}
  window.__thumb=false}

      <div class="cover"${THUMBS[g.id]?` style="background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55)),url(${THUMBS[g.id]}) center/cover"`:''}><h1>${esc(g.name)}</h1>${g.play?'<button class="btn" id="start">Play now</button>':'<p style="color:#fff;font-weight:800;margin:0">Maybe coming soon to TopZoo</p>'}</div></div>
    <div class="under"><h1>${esc(g.name)}</h1>${g.play?'<button class="btn ghost" id="fs">Full screen</button>':''}</div>${g.play?'<p class="tip">Tip: turn your phone sideways and tap Full screen for a bigger game.</p>':''}
    <div class="info"><div class="kv"><span class="chip">${CAT[g.cat]}</span><span class="chip">${g.play?'TopZoo Original':'In development'}</span>${g.d3?'<span class="chip">3D</span>':''}<span class="chip">Works on phone and PC</span></div>
      ${g.play?`<p><b>How to play.</b> ${esc(g.how)}</p><p>${esc(g.about)}</p>`:'<p>This game is still being made. Try one of the TopZoo Originals while you wait.</p>'}</div>
    </div><aside class="side">${ad(300,250)}${more.length?`<h2>More games</h2><div class="grid">${more.map(tile).join('')}</div>`:'<h2>More games soon</h2><p class="empty">New TopZoo games are on the way. Follow us on Facebook to hear first.</p>'}</aside></div>${footer}`;
  window.scrollTo(0,0);

  const p=document.getElementById('player');

}

/* ---------- game engine helper ---------- */
function canvasGame(root,setup){
  const c=document.createElement('canvas');c.width=800;c.height=500;root.appendChild(c);
  const ctx=c.getContext('2d'),g=setup(ctx);
  if(window.__thumb){g.demo&&g.demo();g.draw();return()=>{}}
  let last=performance.now(),raf;
  const loop=t=>{const dt=Math.min(.033,(t-last)/1000);last=t;g.update(dt);g.draw();raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  const kd=e=>{if(g.key&&g.key(e.code,true))e.preventDefault()}, ku=e=>{g.key&&g.key(e.code,false)};
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]};
  c.addEventListener('pointerdown',e=>{e.preventDefault();g.down&&g.down(...pos(e))});
  c.addEventListener('pointermove',e=>{g.move&&g.move(...pos(e))});
  return()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
}
function banner(ctx,title,sub,best){
  if(window.__thumb)return;
  ctx.fillStyle='rgba(10,20,15,.55)';ctx.fillRect(0,0,800,500);
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='44px "Lilita One",sans-serif';ctx.fillText(title,400,220);
  ctx.font='800 20px Nunito,sans-serif';ctx.fillText(sub,400,262);
  if(best!=null){ctx.fillStyle='#ffb22e';ctx.fillText('Best: '+best,400,298)}
}

    const a=rg.attributes.position.array,fy=28*dt,fz=(s.speed||20)*dt*.35;for(let i=0;i<RN;i++){const k=i*6;let y=a[k+1]-fy,z=a[k+2]+fz;if(y<0||z>10){y=16+Math.random()*4;z=-Math.random()*60+8}a[k+1]=y;a[k+2]=z;a[k+4]=y-.9;a[k+5]=z+.3;a[k+3]=a[k]-.05}rg.attributes.position.needsUpdate=true};
  function step(dt,noHit){rainUpd(dt);s.t+=dt;s.shake=Math.max(0,s.shake-dt);
    const play=s.mode==='play';if(play)s.speed=Math.min(64+crRun*.4,s.speed+(.55+crRun*.01)*dt);
    const dz=s.mode==='over'?0:(play?s.speed:12)*dt;if(play)s.dist+=dz*.5;
    sandT.offset.y+=dz/10;roadT.offset.y+=dz/20;curbT.offset.y+=dz/(400/120);
    for(const p of props){p.position.z+=dz;if(p.position.z>20)place(p,p.position.z-195)}
    for(const b of bills){b.position.z+=dz;if(b.position.z>25)b.position.z-=200}
    if(play){s.next-=dz;if(s.next<=0){row(-165);s.next=Math.max(15,32-s.speed*.27)}}
    const tx=LANES[s.lane];s.px+=(tx-s.px)*Math.min(1,dt*11);
    s.vy-=34*dt;s.py=Math.max(0,s.py+s.vy*dt);if(s.py===0)s.vy=0;
    rhino.position.set(s.px,s.py+(s.py===0&&play?Math.sin(s.t*24)*.025:0),0);
    rhino.rotation.set(s.py>0?-.08:0,(tx-s.px)*-.07,(tx-s.px)*.06);
    wheels.forEach(w=>w.rotation.x-=dz/.56);
    for(let i=objs.length-1;i>=0;i--){const o=objs[i],u=o.userData;o.position.z+=dz*(u.rel||1);
      if(u.type==='banana'){o.rotation.y+=dt*3;o.children[0].position.y=Math.sin(s.t*4+o.position.z)*.15;
        if(play&&Math.abs(o.position.x-s.px)<1.6&&Math.abs(o.position.z)<1.7&&Math.abs(o.position.y-(s.py+1.1))<1.9){s.ban+=s.dbl?2:1;blip(880,1500,.12,'sine',.1);
          for(let k=0;k<10;k++)emit(spark,o.position.x,o.position.y,o.position.z,(Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*3,.5);scene.remove(o);objs.splice(i,1);continue}}
      else if(s.mode==='play'&&!noHit&&Math.abs(o.position.x-s.px)<1.95&&Math.abs(o.position.z)<u.half+1.85&&!(u.type==='log'&&s.py>1.15)&&!(u.type==='crate'&&s.py>2.25)){if(s.shield){s.shield=0;scene.remove(o);objs.splice(i,1);s.shake=.4;pop('Shield saved you!');blip(300,900,.25,'triangle',.1);continue}crash();}
      if(o.position.z>16){scene.remove(o);objs.splice(i,1)}}
    if(play&&s.py===0&&Math.random()<s.speed*dt*.9)for(const sx of[-1,1])emit(dust,s.px+sx*1.15,.25,1.6,(Math.random()-.5)*1.5+sx*.6,.6+Math.random()*1.4,1+Math.random()*2,.9);
    tickP(dust,dt,dz,-.4);tickP(spark,dt,dz,6);
    if(fly){if(Math.random()<dt*30){const sd=Math.random()<.5?-1:1;emit(fly,sd*(8+Math.random()*25),.6+Math.random()*3,-20-Math.random()*120,(Math.random()-.5)*.8,(Math.random()-.5)*.5,0,4+Math.random()*3)}tickP(fly,dt,dz,0);fly.p.material.opacity=.6+Math.sin(s.t*7)*.35}
    const f=60+Math.max(0,s.speed-24)*.32;if(Math.abs(f-cam.fov)>.05){cam.fov+=(f-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix()}
    const sh=s.shake>0?s.shake*.6:0;
    cam.position.set(s.px*.55+(Math.random()-.5)*sh,4.4+s.py*.35+(Math.random()-.5)*sh,9.6);cam.lookAt(s.px*.7,1.3+s.py*.25,-9);
    cam.rotation.z+=(tx-s.px)*.012;
    if(eng){const t=ac.currentTime;eng.g.gain.setTargetAtTime(play&&!muted?.03:0,t,.12);const fr=40+s.speed*1.5;eng.o1.frequency.setTargetAtTime(fr,t,.1);eng.o2.frequency.setTargetAtTime(fr*.5,t,.1)}
    $('hd').textContent=Math.floor(s.dist);$('hb').textContent=s.ban;$('hs').textContent=score()}

  if(opts.shot){root.querySelector('.hud').hidden=true;$('ov').hidden=true;s.mode='play';s.speed=30;s.dist=300;
    for(let i=0;i<130;i++)step(1/30,true);s.lane=2;for(let i=0;i<5;i++)step(1/30,true);s.vy=0;s.py=0;
    renderer.render(scene,cam);opts.shot(cv.toDataURL('image/jpeg',.86));return}
  if(opts.rec){root.querySelector('.hud').hidden=true;$('ov').hidden=true;reset();s.mode='play';s.speed=24;
    loadPP().then(()=>{if(alive)setupPP()}).catch(()=>{});
    opts.rec({get s(){return s},objs,LANES,step,render:draw,cv,move,jump,score,pp:()=>!!composer,raw:()=>renderer.render(scene,cam)});return}
  let last=performance.now();
  const frame=t=>{if(!alive)return;raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw()};
  loadPP().then(()=>{if(alive){setupPP();prog(85)}}).catch(()=>{});
  raf=requestAnimationFrame(frame);
  }
}

      case'moon':ctx.arc(x,y,r,.6,2*Math.PI-.6,false);ctx.arc(x+r*.55,y,r*.75,2*Math.PI-1.1,1.1,true);ctx.fill();break;
      case'cross':ctx.rect(x-r*.3,y-r,r*.6,r*2);ctx.rect(x-r,y-r*.3,r*2,r*.6);ctx.fill();break;
      case'drop':ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+r,y+r*.1,x,y+r);ctx.quadraticCurveTo(x-r,y+r*.1,x,y-r);ctx.fill();break;
      case'ring':ctx.arc(x,y,r*.8,0,7);ctx.stroke();break;
      case'bolt':ctx.moveTo(x+r*.2,y-r);ctx.lineTo(x-r*.6,y+r*.1);ctx.lineTo(x,y+r*.1);ctx.lineTo(x-r*.2,y+r);ctx.lineTo(x+r*.6,y-r*.1);ctx.lineTo(x,y-r*.1);ctx.closePath();ctx.fill();break}};
  const panda=(x,y,r)=>{ctx.fillStyle='#1b2430';ctx.beginPath();ctx.arc(x-r*.7,y-r*.7,r*.38,0,7);ctx.arc(x+r*.7,y-r*.7,r*.38,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='#1b2430';
    ctx.beginPath();ctx.ellipse(x-r*.38,y-r*.08,r*.22,r*.3,-.5,0,7);ctx.ellipse(x+r*.38,y-r*.08,r*.22,r*.3,.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x,y+r*.35,r*.14,r*.1,0,0,7);ctx.fill()};
  const tap=(x,y)=>{
    if(s.mode==='ready'){setup(0);return}
    if(s.mode==='won'){setup(s.lv+1<LV.length?s.lv+1:0);return}
    if(s.lock>0)return;
    const c=s.cards.find(c=>x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h);if(!c||c.open||c.done)return;
    c.open=true;s.pick.push(c);
    if(s.pick.length===2){s.moves++;const[a,b]=s.pick;
      if(a.id===b.id){a.done=b.done=true;s.pick=[];
        if(s.cards.every(c=>c.done)){s.mode='won';const r=rating();stars[s.lv]=Math.max(stars[s.lv]||0,r);save('panda-stars',stars)}}
      else s.lock=.8}};
  return{
    key(code,down){if(code==='Space'){if(down&&s.mode!=='play')tap(0,0);return true}},
    demo(){setup(1);s.cards.forEach(c=>{if(c.id<3){c.done=true;c.flip=1}});s.moves=5;s.time=21},
    down:tap,
    update(dt){if(s.mode==='play')s.time+=dt;for(const c of s.cards)c.flip+=((c.open||c.done?1:0)-c.flip)*Math.min(1,dt*12);
      if(s.lock>0){s.lock-=dt;if(s.lock<=0){s.pick.forEach(c=>c.open=false);s.pick=[]}}},
    draw(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#cfeec0');bg.addColorStop(1,'#8fd18a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(47,93,58,.18)';for(let i=0;i<9;i++){const x=i*95+20;ctx.fillRect(x,0,14,H);for(let y=40;y<H;y+=90)ctx.fillRect(x-3,y,20,5)}
      for(const c of s.cards){const k=Math.abs(c.flip*2-1),cx=c.x+c.w/2,w=c.w*Math.max(.04,k);
        ctx.fillStyle=c.flip>.5?(c.done?'#f3fff0':'#ffffff'):'#2f5d3a';ctx.beginPath();ctx.roundRect(cx-w/2,c.y,w,c.h,10);ctx.fill();
        if(c.done){ctx.strokeStyle='#3fbf7f';ctx.lineWidth=3;ctx.stroke()}
        if(k>.3){ctx.save();ctx.translate(cx,c.y+c.h/2);ctx.scale(k,1);ctx.translate(-cx,-(c.y+c.h/2));
          if(c.flip>.5)shape(SY[c.id],cx,c.y+c.h/2,Math.min(c.w,c.h)*.28,CO[c.id]);else panda(cx,c.y+c.h/2,Math.min(c.w,c.h)*.26);ctx.restore()}}
      ctx.textAlign='left';ctx.fillStyle='#1d3b1a';ctx.font='26px "Lilita One",sans-serif';
      if(s.mode!=='ready'){ctx.fillText('Level '+(s.lv+1)+' of '+LV.length,20,40);ctx.textAlign='right';ctx.fillText('Moves '+s.moves+'   Time '+Math.floor(s.time)+'s',W-20,40)}
      if(s.mode==='ready'){const got=stars.reduce((a,b)=>a+(b||0),0);banner(ctx,'Panda Pairs','Tap or press Space to start',got?got+' of '+LV.length*3+' stars':null)}
      if(s.mode==='won')banner(ctx,'★'.repeat(rating())+'☆'.repeat(3-rating())+'  Level clear!',s.moves+' moves in '+Math.floor(s.time)+'s. Tap for '+(s.lv+1<LV.length?'the next level':'level 1 again'),null);}
  }}),

/* Banana Rush: idle clicker */
'banana-rush':root=>{
  const SHOP=[{k:'hand',n:'Better gloves',d:'+1 banana per click',base:40,click:1},{k:'monkey',n:'Monkey',d:'Picks 0.5 bananas a second',base:15,rate:.5},
    {k:'tree',n:'Banana tree',d:'Grows 3 bananas a second',base:120,rate:3},{k:'farm',n:'Plantation',d:'Harvests 15 bananas a second',base:900,rate:15},
    {k:'boat',n:'Banana boat',d:'Ships in 70 bananas a second',base:7000,rate:70}];
  let st=Object.assign({b:0,own:{}},load('banana',{}));
  const n=k=>st.own[k]||0, cost=it=>Math.ceil(it.base*Math.pow(1.15,n(it.k)));
  const rate=()=>SHOP.reduce((a,it)=>a+(it.rate||0)*n(it.k),0), per=()=>1+n('hand');
  const fmt=x=>x>=1e6?(x/1e6).toFixed(2)+'M':x>=1e4?(x/1e3).toFixed(1)+'K':Math.floor(x).toLocaleString();
  root.innerHTML=`<div class="clicker"><div class="left"><div class="count" id="bc"></div><div class="rate" id="br"></div>
    <button class="banana" id="bb" aria-label="Pick a banana"><svg viewBox="0 0 100 100"><path d="M18 30c6 34 34 52 66 44-4 8-18 16-34 14C26 84 12 60 18 30z" fill="#fff36b" stroke="#8a5a00" stroke-width="4" stroke-linejoin="round"/><path d="M18 30l-4-8 8 2z" fill="#5a3b00"/></svg></button>
    <div class="rate">Click the banana!</div></div><div class="shop" id="bs"></div></div>`;
  const $=id=>root.querySelector('#'+id);
  const draw=()=>{$('bc').textContent=fmt(st.b)+' bananas';$('br').textContent=fmt(rate())+' per second · '+per()+' per click';
    $('bs').querySelectorAll('button').forEach((b,i)=>{const it=SHOP[i];b.disabled=st.b<cost(it);b.querySelector('em').textContent=fmt(cost(it));b.querySelector('small').textContent=it.d+' · owned '+n(it.k)})};
  $('bs').innerHTML=SHOP.map(it=>`<button><b>${it.n}</b><small></small><em></em></button>`).join('');
  $('bs').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const it=SHOP[i];if(st.b>=cost(it)){st.b-=cost(it);st.own[it.k]=n(it.k)+1;draw()}});
  $('bb').onclick=()=>{st.b+=per();draw()};
  draw();let tick=0;
  const iv=setInterval(()=>{st.b+=rate()/10;draw();if(++tick%20===0)save('banana',st)},100);
  return()=>{clearInterval(iv);save('banana',st)};
}
};
